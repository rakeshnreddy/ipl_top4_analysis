name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Test data pipeline
        run: python -m unittest discover -s tests

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend/ipl-analyzer-frontend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/ipl-analyzer-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  live-cricket-service:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/live-cricket
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/live-cricket/package-lock.json
      - name: Install service development dependencies
        run: npm ci
      - name: Test adapters and collector
        run: npm test
      - name: Test Worker and Durable Object runtime
        run: npm run test:runtime
      - name: Type-check service
        run: npm run typecheck
      - name: Verify bundle without deploying
        run: npm run dry-run
