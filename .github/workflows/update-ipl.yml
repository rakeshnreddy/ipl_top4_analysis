name: Update League Data and Deploy

on:
  schedule:
    # 01:00 IST: after evening matches in India and Australia. Off-season nights
    # build nothing: `--league active` only touches leagues inside their season
    # window (or awaiting their final Cricsheet rebuild), so no API calls are made.
    - cron: '30 19 * * *'
  workflow_dispatch:
    inputs:
      league:
        description: "League id to rebuild, 'all', or 'active'"
        required: false
        default: active

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate CricketData configuration
        env:
          CRICDATA_API_KEY: ${{ secrets.CRICDATA_API_KEY }}
        run: |
          if [ -z "$CRICDATA_API_KEY" ]; then
            echo "::error::CRICDATA_API_KEY repository secret is required."
            exit 1
          fi

      - name: Generate league payloads
        env:
          CRICDATA_API_KEY: ${{ secrets.CRICDATA_API_KEY }}
          # Optional; applies to the default league only. Other leagues set seriesId in their config.
          CRICDATA_SERIES_ID: ${{ secrets.CRICDATA_SERIES_ID }}
          LEAGUE: ${{ inputs.league || 'active' }}
        run: python extract_table.py --league "$LEAGUE"

      - name: Generate Instagram carousel slides
        run: python scripts/create_instagram_carousel.py

      - name: Validate generated data
        run: python -m unittest discover -s tests

      - name: Persist generated data and carousel
        id: persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/ipl-analyzer-frontend/public/data
          git add frontend/ipl-analyzer-frontend/public/social/instagram-carousel
          if git diff --cached --quiet; then
            echo "No generated data or carousel changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update league data [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Nothing below runs unless new data was committed.
      - name: Set up Node.js
        if: steps.persist.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/ipl-analyzer-frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.persist.outputs.changed == 'true'
        working-directory: frontend/ipl-analyzer-frontend
        run: npm ci

      - name: Test frontend
        if: steps.persist.outputs.changed == 'true'
        working-directory: frontend/ipl-analyzer-frontend
        run: npm test -- --run

      - name: Build frontend
        if: steps.persist.outputs.changed == 'true'
        working-directory: frontend/ipl-analyzer-frontend
        run: |
          npm run build:github
          touch dist/.nojekyll

      - name: Configure Pages
        if: steps.persist.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.persist.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/ipl-analyzer-frontend/dist

      - name: Deploy Pages
        if: steps.persist.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
