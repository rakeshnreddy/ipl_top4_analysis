name: Update League Data and Deploy

on:
  schedule:
    # `--league active` only builds leagues inside their season window (or awaiting
    # their final Cricsheet rebuild); a run where nothing changed commits nothing.
    # 19:30 UTC: after evening cricket in India and Australia and European afternoon games.
    - cron: '30 19 * * *'
    # 07:00 UTC: after European evening games and North American night games.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      league:
        description: "League id to rebuild, 'all', or 'active'"
        required: false
        default: active

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Shared with the other Pages workflow; queue rather than cancel, so a code deploy
  # never kills a data run halfway (or the other way round).
  group: pages
  cancel-in-progress: false

jobs:
  update-build-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    env:
      # Secrets cannot be tested in `if:`; this makes the Cloudflare steps conditional.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check CricketData configuration
        env:
          CRICDATA_API_KEY: ${{ secrets.CRICDATA_API_KEY }}
        run: |
          if [ -z "$CRICDATA_API_KEY" ]; then
            echo "::warning::CRICDATA_API_KEY is not set; live cricket leagues will be skipped. Other sports need no key."
          fi

      # Downloaded feeds and Cricsheet archives: a source that is down for a night
      # falls back to the last good copy instead of failing that league.
      - name: Restore source caches
        uses: actions/cache@v6
        with:
          path: .cache
          key: league-sources-${{ github.run_id }}
          restore-keys: league-sources-

      - name: Generate league payloads
        env:
          CRICDATA_API_KEY: ${{ secrets.CRICDATA_API_KEY }}
          # Optional; applies to the default league only. Other leagues set seriesId in their config.
          CRICDATA_SERIES_ID: ${{ secrets.CRICDATA_SERIES_ID }}
          LEAGUE: ${{ inputs.league || 'active' }}
        run: python extract_table.py --league "$LEAGUE"

      - name: Generate Instagram carousel slides
        run: python scripts/create_instagram_carousel.py

      - name: Validate generated data
        run: python -m unittest discover -s tests

      - name: Persist generated data and carousel
        id: persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/ipl-analyzer-frontend/public/data
          git add frontend/ipl-analyzer-frontend/public/social/instagram-carousel
          if git diff --cached --quiet; then
            echo "No generated data or carousel changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update league data [skip ci]"
            # main may have moved while the job ran; replay the data commit on top.
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                exit 1
              fi
              sleep 10
              git pull --rebase origin main
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Nothing below runs unless new data was committed.
      - name: Set up Node.js
        if: steps.persist.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/ipl-analyzer-frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.persist.outputs.changed == 'true'
        working-directory: frontend/ipl-analyzer-frontend
        run: npm ci

      - name: Test frontend
        if: steps.persist.outputs.changed == 'true'
        working-directory: frontend/ipl-analyzer-frontend
        run: npm test -- --run

      - name: Configure Pages
        id: pages
        if: steps.persist.outputs.changed == 'true'
        uses: actions/configure-pages@v6

      - name: Build frontend
        if: steps.persist.outputs.changed == 'true'
        working-directory: frontend/ipl-analyzer-frontend
        env:
          # The deployed address, for sitemap.xml.
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          npm run build:github
          touch dist/.nojekyll

      - name: Upload Pages artifact
        if: steps.persist.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/ipl-analyzer-frontend/dist

      - name: Deploy Pages
        if: steps.persist.outputs.changed == 'true'
        uses: actions/deploy-pages@v5

      # Mirror at https://ipl-playoff-pulse.pages.dev (served from the site root, so it needs
      # its own build; dist is free again once GitHub Pages has its artifact). Runs once the
      # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist; a Cloudflare problem
      # shows as a warning and never fails the run.
      - name: Build for Cloudflare Pages
        id: cloudflare_build
        if: steps.persist.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        working-directory: frontend/ipl-analyzer-frontend
        env:
          SITE_URL: https://ipl-playoff-pulse.pages.dev/
        run: npx vite build --base=/

      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare_build.outcome == 'success' && steps.persist.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/ipl-analyzer-frontend/dist --project-name ipl-playoff-pulse --branch main
