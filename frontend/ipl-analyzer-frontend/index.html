<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="%BASE_URL%" />
    <link rel="canonical" href="%BASE_URL%" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eef0f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1016" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply a saved theme before first paint (see src/lib/theme.ts); otherwise the system decides.
      try {
        var theme = localStorage.getItem('pp-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
      } catch (error) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Daily title, playoff and relegation odds for European football and the Champions League, MLS and the NWSL, the NFL, NBA, WNBA, NHL and MLB, Formula 1, Australia's A-Leagues and NBL, and T20 cricket leagues from the IPL to the Big Bash."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:site_name" content="Playoff Pulse" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Playoff Pulse | Live Title & Playoff Odds" />
    <meta property="og:url" content="%BASE_URL%" />

      property="og:description"
